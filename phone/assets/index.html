<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keystone</title>
<style>
  :root { --bg:#0a1c36; --panel:#0f2748; --deep:#071428; --line:#1d3a66; --ink:#eaf3ff; --muted:#a9c3e6; --accent:#7fd0ff; --on:#06203c; --warn:#ffb38a; --ok:#9be0b4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  a { color: var(--accent); }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  button, input { font: inherit; color: inherit; }
  .view { height: 100%; display: flex; flex-direction: column; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); gap: 14px; }
  .top { display: flex; align-items: center; gap: 12px; flex: none; }
  .back, .round { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--line); background: none; color: var(--ink); display: grid; place-items: center; flex: none; }
  .back svg, .round svg { width: 22px; height: 22px; }
  .muted { color: var(--muted); } .small { font-size: 16px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
  /* home */
  .brand { font-weight: 600; letter-spacing: .18em; font-size: 15px; flex: 1; }
  .tile { border-radius: 24px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; gap: 18px; padding: 0 22px; text-align: left; flex: 1; min-height: 110px; }
  .tile svg { width: 40px; height: 40px; flex: none; color: var(--accent); }
  .tile b { display: block; font-size: 26px; font-weight: 600; }
  .tile span span { display: block; color: var(--muted); font-size: 17px; }
  .tile.talk { flex: 2; background: var(--accent); color: var(--on); border: 0; flex-direction: column; justify-content: center; gap: 8px; text-align: center; }
  .tile.talk svg { width: 64px; height: 64px; color: var(--on); }
  .tile.talk b { font-size: 30px; }
  .tile.talk span span { color: var(--on); font-size: 16px; }
  /* rows */
  .rowbtn { display: flex; align-items: center; gap: 14px; min-height: 78px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px; text-align: left; width: 100%; flex: none; }
  .rowbtn.warn { border-color: var(--warn); }
  .rowbtn .b { flex: 1; min-width: 0; }
  .rowbtn .t { display: block; font-size: 20px; font-weight: 500; overflow-wrap: anywhere; }
  .rowbtn .s { display: block; color: var(--muted); font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowbtn.warn .s { color: var(--warn); }
  .rowbtn input[type=checkbox] { width: 30px; height: 30px; flex: none; accent-color: var(--accent); margin: 0; }
  .rowbtn.done .t { text-decoration: line-through; color: var(--muted); }
  .more { min-height: 52px; border-radius: 14px; border: 1px dashed var(--line); background: none; color: var(--muted); font-size: 17px; flex: none; }
  .btn { min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: none; color: var(--ink); font-size: 19px; font-weight: 500; padding: 0 16px; flex: none; }
  .btn.yes { background: var(--accent); color: var(--on); border-color: var(--accent); font-weight: 600; }
  .btn.line { color: var(--accent); border-color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
  .btn.line svg { width: 24px; height: 24px; }
  input[type=text], input[type=search] { min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--deep); color: var(--ink); font-size: 19px; padding: 0 16px; width: 100%; }
  label.f { display: grid; gap: 6px; color: var(--muted); font-size: 15px; flex: none; }
  .cap { margin: 4px 0 0; color: var(--muted); font-size: 15px; letter-spacing: .06em; flex: none; }
  /* talk */
  #talk { justify-content: flex-start; gap: 12px; }
  .msg { max-width: 90%; padding: 12px 16px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; flex: none; }
  .me { align-self: flex-end; background: #163a6b; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; font-size: 21px; }
  .note { align-self: center; color: var(--muted); font-size: 16px; text-align: center; flex: none; }
  .err { align-self: flex-start; background: #3a1f12; border: 1px solid var(--warn); color: #ffd9c4; }
  .card { background: var(--panel); border: 2px solid var(--accent); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .card.old { border: 1px solid var(--line); }
  .card .ln { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--deep); border-radius: 12px; padding: 10px 14px; }
  .two { display: flex; gap: 10px; } .two > * { flex: 1; }
  .micwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }
  #mic { width: 108px; height: 108px; border-radius: 54px; border: 0; background: var(--accent); color: var(--on); display: grid; place-items: center; box-shadow: 0 0 0 12px rgba(127,208,255,.14); }
  #mic:disabled { opacity: .5; }
  #mic svg { width: 46px; height: 46px; }
  .plain { min-height: 48px; padding: 0 18px; border: 0; background: none; color: var(--muted); font-size: 17px; }
  .pill { align-self: center; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 22px; border: 1px solid var(--accent); color: var(--accent); font-size: 16px; flex: none; }
  .pill button { width: 36px; height: 36px; border: 0; background: none; color: var(--accent); font-size: 20px; }
  .busy { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .busy { animation: none; } }
  /* job */
  .grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex: none; }
  .big { min-height: 92px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 21px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; text-align: center; padding: 6px; }
  .big.yes { background: var(--accent); color: var(--on); border: 0; font-weight: 600; }
  .big small { font-size: 15px; font-weight: 400; }
  details { border: 1px solid var(--line); border-radius: 16px; flex: none; }
  summary { min-height: 62px; padding: 0 18px; display: flex; justify-content: space-between; align-items: center; list-style: none; font-size: 19px; }
  summary::-webkit-details-marker { display: none; }
  summary span { color: var(--muted); }
  details > div { padding: 0 18px 16px; display: grid; gap: 14px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .acts a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--deep); text-decoration: none; font-size: 17px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 17px; } dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .sheet { position: fixed; inset: 0; background: rgba(3,10,22,.7); display: flex; align-items: flex-end; z-index: 10; }
  .sheet > div { background: var(--panel); border-radius: 18px 18px 0 0; width: 100%; max-height: 82%; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .opt { min-height: 54px; text-align: left; background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
  .opt.cur { border-color: var(--accent); color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 14px; min-height: 84px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 18px; flex: none; }
  .toggle .b { flex: 1; } .toggle .t { display: block; font-size: 20px; font-weight: 500; } .toggle .s { display: block; color: var(--muted); font-size: 16px; }
  .toggle input { width: 30px; height: 30px; accent-color: var(--accent); flex: none; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></symbol>
  <symbol id="i-case" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
</svg>

<section class="view" id="v-home" hidden>
  <div class="top"><span class="brand">KEYSTONE</span><button class="round" type="button" data-go="menu" aria-label="Settings"><svg><use href="#i-dots"/></svg></button></div>
  <p id="hello" style="margin:0;font-size:26px;font-weight:500;line-height:1.25;flex:none"></p>
  <button class="tile talk" type="button" data-go="talk"><svg><use href="#i-mic"/></svg><span><b>Talk</b><span>Notes, calls, invites, questions</span></span></button>
  <button class="tile" type="button" data-go="day"><svg><use href="#i-check"/></svg><span><b>My day</b><span id="h-day">Tap to see your list</span></span></button>
  <button class="tile" type="button" data-go="jobs"><svg><use href="#i-case"/></svg><span><b>Jobs</b><span id="h-jobs">Your open jobs</span></span></button>
</section>

<section class="view" id="v-talk" hidden>
  <div class="top"><button class="back" type="button" data-go="home" aria-label="Back to home"><svg><use href="#i-back"/></svg></button><h1>Talk</h1></div>
  <div class="scroll" id="talk" aria-live="polite"></div>
  <div class="pill" id="about" hidden><span id="about-t"></span><button type="button" id="about-x" aria-label="Clear">×</button></div>
  <form id="typeform" class="two" hidden><input id="text" type="text" autocomplete="off" placeholder="Type here" aria-label="Type to Keystone" style="flex:3"><button class="btn yes" type="submit" style="flex:1">Send</button></form>
  <div class="micwrap"><button id="mic" type="button" aria-label="Talk to Keystone"><svg><use href="#i-mic"/></svg></button><button class="plain" type="button" id="typebtn">Type instead</button></div>
</section>

<section class="view" id="v-day" hidden>
  <div class="top"><button class="back" type="button" data-go="home" aria-label="Back to home"><svg><use href="#i-back"/></svg></button><div style="flex:1"><h1>My day</h1><p class="muted small" id="d-sub" style="margin:0"></p></div><button class="plain" type="button" id="d-refresh">Refresh</button></div>
  <div class="scroll" id="day"></div>
</section>

<section class="view" id="v-jobs" hidden>
  <div class="top"><button class="back" type="button" data-go="home" aria-label="Back to home"><svg><use href="#i-back"/></svg></button><h1>Jobs</h1></div>
  <label class="f">Find a job<input type="search" id="j-q" placeholder="Name, street or number" autocomplete="off"></label>
  <p class="cap" id="j-cap">RECENT</p>
  <div class="scroll" id="jobs"></div>
</section>

<section class="view" id="v-job" hidden>
  <div class="top"><button class="back" type="button" data-go="jobs" aria-label="Back to jobs"><svg><use href="#i-back"/></svg></button><span class="muted">Jobs</span></div>
  <div class="scroll" id="job"></div>
</section>

<section class="view" id="v-menu" hidden>
  <div class="top"><button class="back" type="button" data-go="home" aria-label="Back to home"><svg><use href="#i-back"/></svg></button><h1>Settings</h1></div>
  <div class="scroll">
    <label class="toggle"><span class="b"><span class="t">Hands-free</span><span class="s">Keeps listening after each answer</span></span><input type="checkbox" id="s-hands"></label>
    <label class="toggle"><span class="b"><span class="t">Read answers aloud</span><span class="s">Turn off when you're with a customer</span></span><input type="checkbox" id="s-voice"></label>
    <button class="rowbtn" type="button" data-go="pair"><span class="b"><span class="t">Connect to the laptop again</span><span class="s">Refreshes contacts and shop inventory</span></span></button>
    <div style="flex:1"></div>
    <p class="muted small" id="s-about" style="margin:0;text-align:center"></p>
  </div>
</section>

<section class="view" id="v-pair" hidden>
  <div class="top"><button class="back" type="button" id="p-back" data-go="menu" aria-label="Back"><svg><use href="#i-back"/></svg></button><h1>Connect this phone</h1></div>
  <div class="scroll" style="gap:14px">
    <p class="muted" style="margin:0">On the same Wi-Fi as your laptop: open the Keystone folder there and double-click <b style="color:var(--ink)">Connect phone</b>. Type the address and code it shows.</p>
    <label class="f">Address on the laptop screen<input type="text" id="p-addr" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.23:4320"></label>
    <label class="f">6-digit code<input type="text" id="p-code" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123456"></label>
    <button class="btn yes" id="p-go" type="button">Connect</button>
    <p id="p-msg" role="status" style="margin:0"></p>
  </div>
</section>

<script src="app.js"></script>
<script>
"use strict";
// ---- the bridge to the Android app (window.Native); results come back through window.nativeDone
const waiting = new Map();
let seq = 0;
window.nativeDone = (id, result) => { const w = waiting.get(id); if (w) { waiting.delete(id); w(result); } };
const call = (fn, ...args) => new Promise((resolve) => { const id = `c${++seq}`; waiting.set(id, resolve); Native[fn](id, ...args); });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (n) => (n == null || n === "" ? "" : `$${Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 })}`);
const tel = (p) => String(p || "").replace(/\D/g, "");
const readAloud = () => Native.get("readAloud") !== "off";
const handsFree = () => Native.get("handsFree") === "on";

// Reading aloud, with a way to know when it has finished (hands-free listens again then).
let spokenDone = null;
window.onSpoken = () => { const f = spokenDone; spokenDone = null; if (f) f(); };
function say(text) {
  return new Promise((resolve) => {
    if (!readAloud() || !text) return resolve();
    const timer = setTimeout(() => { if (spokenDone === finish) { spokenDone = null; resolve(); } }, 60000);
    const finish = () => { clearTimeout(timer); resolve(); };
    spokenDone = finish;
    Native.speak(String(text).replace(/[*_#`]/g, ""));
  });
}
const hush = () => { spokenDone = null; Native.quiet(); };

const io = {
  get: (k) => Native.get(k),
  set: (k, v) => Native.set(k, v),
  http: async (r) => {
    const res = await call("http", r.method, r.url, JSON.stringify(r.headers || {}), r.body ?? null);
    if (res.error) throw new Error(/Unable to resolve host|timeout|Failed to connect|unreachable/i.test(res.error) ? "No connection. Check your signal and try again." : res.error);
    return res;
  },
  // A Yes/No card before anything is written. Hands-free, it's read out and "yes" or "no" can be spoken.
  confirm: (title, lines) => new Promise((resolve) => {
    show("talk");
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<b>${esc(title)}</b>${lines.map((l) => `<div class="ln">${esc(l)}</div>`).join("")}<div class="two"><button class="btn" type="button" data-a="no">No</button><button class="btn yes" type="button" data-a="yes">Yes</button></div>`;
    let settled = false;
    const settle = (yes) => {
      if (settled) return; settled = true; hush();
      el.querySelector(".two").outerHTML = `<div class="muted small">${yes ? "You said yes." : "You said no."}</div>`;
      el.classList.add("old"); resolve(yes);
    };
    el.addEventListener("click", (e) => { const a = e.target.closest("[data-a]")?.dataset.a; if (a) settle(a === "yes"); });
    $("#talk").appendChild(el); scrollDown();
    (async () => {
      await say(handsFree() ? `${title} ${lines.join(". ").slice(0, 400)}. Say yes or no.` : `${title} Yes or no?`);
      if (!handsFree() || settled) return;
      const r = await call("listen");
      const t = (r.text || "").trim().toLowerCase();
      if (/^(yes|yeah|yep|yup|do it|go ahead|confirm|correct|sure|ok|okay)\b/.test(t)) settle(true);
      else if (/^(no|nope|cancel|don't|do not|stop|wait)\b/.test(t)) settle(false);
    })();
  }),
};
const K = KeystonePhone.create(io);

// ============================================================ Screens
const VIEWS = ["home", "talk", "day", "jobs", "job", "menu", "pair"];
let view = "home";
function show(v) {
  view = v;
  for (const x of VIEWS) $("#v-" + x).hidden = x !== v;
  if (v === "home") drawHome();
  if (v === "day") loadDay(false);
  if (v === "jobs") loadJobs(false);
  if (v === "menu") drawMenu();
  if (v === "pair") { $("#p-msg").textContent = ""; $("#p-addr").value = Native.get("lastAddress") || ""; $("#p-back").hidden = !K.paired(); }
  if (v !== "talk") hush();
}
document.addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) { if (g.dataset.go === "talk") startTalk(null); show(g.dataset.go); } });

// ============================================================ Home
function drawHome() {
  const h = new Date().getHours(), s = K.setup();
  $("#hello").textContent = `Good ${h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"}, ${(s?.me?.name || "").split(" ")[0] || "there"}.`;
  if (dayData) { const n = dayData.items.length; $("#h-day").textContent = n ? `${n} thing${n === 1 ? "" : "s"}${dayData.waiting ? ` · ${dayData.waiting} waiting on you` : ""}` : "Nothing waiting. You're clear."; $("#h-day").style.color = dayData.waiting ? "var(--warn)" : ""; }
  if (jobsAll) { const n = jobsAll.filter((j) => j.mine).length; $("#h-jobs").textContent = `${n} open with you on them`; }
}
// Fill in the counts quietly once the app is open.
async function warm() { try { dayData = await K.dayList(false); jobsAll = await K.myJobs(false); if (view === "home") drawHome(); } catch { /* shown when the screen is opened */ } }

// ============================================================ Talk
const scrollDown = () => { const t = $("#talk"); t.scrollTop = t.scrollHeight; };
// Phone numbers and emails in an answer become tappable.
const linkify = (s) => esc(s).replace(/\(\d{3}\) \d{3}-\d{4}|\b\d{3}-\d{3}-\d{4}\b/g, (m) => `<a href="tel:${m.replace(/\D/g, "")}">${m}</a>`).replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, (m) => `<a href="mailto:${m}">${m}</a>`);
function add(kind, text, html) { const el = document.createElement("div"); el.className = kind === "note" ? "note" : `msg ${kind}`; if (html) el.innerHTML = html; else el.textContent = text; $("#talk").appendChild(el); scrollDown(); return el; }

// What the next thing said is about: set by a button ("Add a note" on a job), shown as a pill, used once.
let about = null;
function startTalk(a, listenNow) {
  about = a;
  $("#about").hidden = !a; if (a) $("#about-t").textContent = a.label;
  if (!$("#talk").children.length) add("note", "Tap the microphone and say what you need.");
  if (listenNow) setTimeout(listen, 250);
}
$("#about-x").onclick = () => startTalk(null);

const STEP = { find_jobs: "Looking up the job", get_job: "Reading the job", find_contact: "Looking them up", add_note: "Writing the note", log_call: "Logging the call", calendar_list: "Checking your calendar", calendar_create: "Setting up the event", gmail_draft: "Writing the draft", set_stage: "Changing the stage", my_day: "Putting your day together", my_jobs: "Reading your jobs", shop_stock: "Checking the shop" };
let history = [], busy = false;
async function send(text) {
  text = String(text || "").trim();
  if (!text || busy) return;
  show("talk");
  busy = true; $("#mic").disabled = true; hush();
  add("me", text);
  const full = about ? `${about.prefix}${text}` : text;
  startTalk(null);
  const status = add("note", "", `<span class="busy"></span>Thinking…`);
  let answer = "";
  try {
    const r = await K.ask(full, history, (name) => { status.innerHTML = `<span class="busy"></span>${esc(STEP[name] || "Working")}…`; scrollDown(); });
    history = r.history; answer = r.text;
    status.remove();
    add("ai", "", linkify(r.text));
    dayData = null;
  } catch (e) {
    status.remove();
    add("err", e.message || "Something went wrong.");
    answer = e.message || "";
  }
  busy = false; $("#mic").disabled = false;
  await say(answer);
  if (handsFree() && view === "talk" && !busy) listen();
}
async function listen() {
  if (busy) return;
  hush();
  const r = await call("listen");
  if (r.error) { add("err", r.error); return; }
  const t = (r.text || "").trim();
  if (!t || /^(stop|stop listening|that's all|that is all|never ?mind|cancel|done|goodbye)\.?$/i.test(t)) {
    if (handsFree() && t) add("note", "Okay, I've stopped listening.");
    return;
  }
  send(t);
}
$("#mic").onclick = listen;
$("#typebtn").onclick = () => { const f = $("#typeform"); f.hidden = !f.hidden; $("#typebtn").textContent = f.hidden ? "Type instead" : "Hide keyboard"; if (!f.hidden) $("#text").focus(); };
$("#typeform").onsubmit = (e) => { e.preventDefault(); const t = $("#text").value; $("#text").value = ""; send(t); };

// ============================================================ My day: one short list
let dayData = null, dayBusy = false, dayAll = false;
async function loadDay(force) {
  const el = $("#day");
  if (dayBusy) return;
  if (dayData && !force && Date.now() - Date.parse(dayData.at) < 5 * 60000) return drawDay();
  dayBusy = true;
  if (!dayData) { el.innerHTML = `<p class="note"><span class="busy"></span>Putting your day together…</p>`; $("#d-sub").textContent = ""; }
  try { dayData = await K.dayList(force); } catch (e) { el.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; dayBusy = false; return; }
  dayBusy = false; drawDay();
}
function drawDay() {
  const d = dayData, n = d.items.length, SHOWN = 5;
  $("#d-sub").textContent = `${new Date().toLocaleDateString("en-US", { weekday: "long" })} · ${n ? `${n} thing${n === 1 ? "" : "s"}` : "all clear"}`;
  const list = dayAll ? d.items : d.items.slice(0, SHOWN);
  $("#day").innerHTML = (list.map((x, i) => `<div class="rowbtn ${x.warn ? "warn" : ""}" data-i="${i}"><input type="checkbox" aria-label="Done: ${esc(x.title)}"><button type="button" class="b" style="background:none;border:0;padding:0;text-align:left" data-open="${i}"><span class="t">${esc(x.title)}</span><span class="s">${esc(x.sub)}</span></button></div>`).join("") || `<p class="note" style="margin-top:40px">Nothing needs you right now.</p>`)
    + (n > SHOWN ? `<button class="more" type="button" id="d-more">${dayAll ? "Show less" : `Show ${n - SHOWN} more`}</button>` : "")
    + (d.problems.length ? `<p class="small" style="margin:6px 0 0;color:var(--warn)">Some of this couldn't be read: ${esc(d.problems[0])}</p>` : "");
}
$("#d-refresh").onclick = () => { dayData = null; loadDay(true); };
$("#day").addEventListener("click", (e) => {
  if (e.target.closest("#d-more")) { dayAll = !dayAll; return drawDay(); }
  const o = e.target.closest("[data-open]"); if (!o) return;
  const x = (dayAll ? dayData.items : dayData.items.slice(0, 5))[Number(o.dataset.open)];
  if (x.kind === "job") return openJob(x.jobNumber);
  if (x.kind === "email") return sheet(`${x.from}: ${x.subject}`, x.snippet, [["Draft a reply", () => { startTalk({ label: `Reply to ${x.from}`, prefix: `Draft a reply to ${x.from} about "${x.subject}". What I want to say: ` }, true); show("talk"); }], ["Open in Gmail", () => Native.open(`https://mail.google.com/mail/u/0/#inbox/${x.threadId}`)]]);
  if (x.kind === "cal" && x.location) return sheet(x.title, x.location, [["Directions", () => Native.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.location)}`)]]);
});
$("#day").addEventListener("change", async (e) => {
  const row = e.target.closest("[data-i]"); if (!row) return;
  const x = (dayAll ? dayData.items : dayData.items.slice(0, 5))[Number(row.dataset.i)], done = e.target.checked;
  row.classList.toggle("done", done);
  try { if (x.kind === "task") await K.setTaskDone(x.list, x.task, done); K.markDone(x.id, done); }
  catch (err) { e.target.checked = !done; row.classList.toggle("done", !done); return alert(`Couldn't update that: ${err.message}`); }
  // The line leaves the list the next time the screen is drawn, so a slip can be unticked first.
  dayData.at = new Date(0).toISOString();
});
// A small sheet from the bottom: a title, a line of detail and a few big choices.
function sheet(title, detail, choices) {
  const s = document.createElement("div"); s.className = "sheet";
  s.innerHTML = `<div><b style="font-size:21px">${esc(title)}</b>${detail ? `<p class="muted" style="margin:0 0 6px">${esc(detail)}</p>` : ""}${choices.map(([label], i) => `<button type="button" class="btn ${i === 0 ? "yes" : ""}" data-c="${i}">${esc(label)}</button>`).join("")}<button type="button" class="plain" data-x="1">Close</button></div>`;
  document.body.appendChild(s);
  s.onclick = (e) => { const c = e.target.closest("[data-c]"); if (c) { s.remove(); return choices[Number(c.dataset.c)][1](); } if (e.target === s || e.target.closest("[data-x]")) s.remove(); };
}

// ============================================================ Jobs
let jobsAll = null, jobsBusy = false, jobsEvery = false;
const recent = () => { try { return JSON.parse(Native.get("recentJobs") || "[]"); } catch { return []; } };
async function loadJobs(force) {
  const el = $("#jobs");
  if (jobsAll && !force) return drawJobs();
  if (jobsBusy) return;
  jobsBusy = true;
  el.innerHTML = `<p class="note"><span class="busy"></span>Reading your jobs from Homebase… about 15 seconds the first time each day.</p>`;
  try { jobsAll = await K.myJobs(force); } catch (e) { el.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; jobsBusy = false; return; }
  jobsBusy = false; drawJobs();
}
function drawJobs() {
  const q = $("#j-q").value.trim().toLowerCase(), mine = (jobsAll || []).filter((j) => j.mine);
  let list, cap;
  if (q) { list = (jobsAll || []).filter((j) => `#${j.jobNumber} ${j.name} ${j.address} ${j.stage}`.toLowerCase().includes(q)).slice(0, 30); cap = "MATCHES"; }
  else if (jobsEvery) { list = mine; cap = "ALL MY JOBS"; }
  else { const r = recent().map((n) => (jobsAll || []).find((j) => j.jobNumber === n)).filter(Boolean); list = [...r, ...mine.filter((j) => !r.includes(j))].slice(0, 5); cap = r.length ? "RECENT" : "MY JOBS"; }
  $("#j-cap").textContent = cap;
  $("#jobs").innerHTML = (list.map((j) => `<button type="button" class="rowbtn" data-job="${j.jobNumber}"><span class="b"><span class="t">#${j.jobNumber} ${esc(j.name)}</span><span class="s">${esc(j.stage)}</span></span></button>`).join("") || `<p class="note">${q ? "No open job matches that." : "None of the open jobs have you on them."}</p>`)
    + (!q && mine.length > 5 ? `<button class="btn" type="button" id="j-all" style="color:var(--accent)">${jobsEvery ? "Show fewer" : `All ${mine.length} of my jobs`}</button>` : "")
    + (!q && jobsEvery ? `<button class="plain" type="button" id="j-refresh">Refresh from Homebase</button>` : "");
}
$("#j-q").oninput = drawJobs;
$("#jobs").onclick = (e) => {
  if (e.target.closest("#j-all")) { jobsEvery = !jobsEvery; return drawJobs(); }
  if (e.target.closest("#j-refresh")) return loadJobs(true);
  const b = e.target.closest("[data-job]"); if (b) openJob(Number(b.dataset.job));
};

// ============================================================ One job: four big actions, the rest folded away
let jobOpen = null;
async function openJob(n) {
  show("job");
  Native.set("recentJobs", JSON.stringify([n, ...recent().filter((x) => x !== n)].slice(0, 5)));
  const el = $("#job");
  el.innerHTML = `<p class="note"><span class="busy"></span>Reading #${n}…</p>`;
  let j;
  try { j = await K.getJob(n); } catch (e) { el.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  jobOpen = j;
  const days = j.stageSince ? Math.max(0, Math.floor((Date.now() - Date.parse(j.stageSince)) / 864e5)) : null;
  const first = j.contacts.find((c) => c.phone) || null;
  const person = (c) => `<div><b>${esc(c.name)}</b>${c.roles ? ` <span class="muted small">· ${esc(c.roles)}</span>` : ""}${c.company ? `<div class="muted small">${esc(c.company)}</div>` : ""}<div class="acts">${c.phone ? `<a href="tel:${tel(c.phone)}">Call</a><a href="sms:${tel(c.phone)}">Text</a>` : ""}${c.email ? `<a href="mailto:${esc(c.email)}">Email</a>` : ""}</div></div>`;
  const facts = [["Carrier", j.carrier], ["Claim", j.claimNumber], ["Proposal", usd(j.proposalAmount)], ["Contract", usd(j.contractAmount)], ["Estimator", j.people?.estimator], ["Project manager", j.people?.projectManager]].filter(([, v]) => v);
  el.innerHTML = `<div style="flex:none"><h1 style="font-size:30px">#${j.jobNumber} ${esc(j.name)}</h1><p class="muted" style="margin:4px 0 0">${esc(j.stage)}${days != null ? ` · ${days} day${days === 1 ? "" : "s"}` : ""}</p>${j.address ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.address)}" style="display:inline-flex;align-items:center;min-height:44px">${esc(j.address)}</a>` : ""}</div>
    <div class="grid4">
      ${first ? `<a class="big yes" href="tel:${tel(first.phone)}">Call ${esc(first.name.split(" ")[0])}<small>${esc(first.roles === "Primary" ? "main contact" : first.roles || "")}</small></a>` : `<button class="big" type="button" disabled style="opacity:.5">No phone number</button>`}
      <button class="big" type="button" data-act="note">Add a note</button>
      <button class="big" type="button" data-act="sched">Schedule</button>
      <button class="big" type="button" data-act="stage">Change stage</button>
    </div>
    <details><summary>People <span>${j.contacts.length}</span></summary><div>${j.contacts.map(person).join("") || `<span class="muted">Nobody on this job in Homebase.</span>`}</div></details>
    <details><summary>Latest notes <span>${j.recentNotes.length}</span></summary><div>${j.recentNotes.map((x) => `<div><span class="muted small">${esc(x.author)} · ${x.at ? new Date(x.at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : ""}</span><div>${esc(x.body)}</div></div>`).join("") || `<span class="muted">No team notes yet.</span>`}</div></details>
    <details><summary>Claim and amounts <span>${esc(j.carrier || "")}</span></summary><div><dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("") || `<dt>Nothing filled in</dt><dd></dd>`}</dl></div></details>
    <button class="btn line" type="button" data-act="talk"><svg><use href="#i-mic"/></svg>Talk about this job</button>`;
}
$("#job").addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]")?.dataset.act, j = jobOpen; if (!a || !j) return;
  const tag = `#${j.jobNumber} ${j.name}`;
  if (a === "note") { startTalk({ label: `Note for ${tag}`, prefix: `Add a note to job ${j.jobNumber}: ` }, true); show("talk"); }
  if (a === "sched") { startTalk({ label: `Schedule for ${tag}`, prefix: `For job ${j.jobNumber} (${j.name}), put this on my calendar: ` }, true); show("talk"); }
  if (a === "talk") { startTalk({ label: `About ${tag}`, prefix: `About job ${j.jobNumber} (${j.name}): ` }, true); show("talk"); }
  if (a === "stage") pickStage(j);
});
async function pickStage(j) {
  let stages;
  try { stages = await K.stages(); } catch (e) { return alert(e.message); }
  const s = document.createElement("div"); s.className = "sheet";
  s.innerHTML = `<div><b style="font-size:21px">Move #${j.jobNumber} ${esc(j.name)} to…</b>${stages.filter((x) => x !== "Closed Lost").map((x) => `<button type="button" class="opt ${x === j.stage ? "cur" : ""}" data-s="${esc(x)}">${esc(x)}${x === j.stage ? " (now)" : ""}</button>`).join("")}<p class="muted small" style="margin:4px 0 0">Closed Lost needs a reason: do that one on the laptop.</p><button type="button" class="plain" data-x="1">Cancel</button></div>`;
  document.body.appendChild(s);
  s.onclick = async (e) => {
    const st = e.target.closest("[data-s]")?.dataset.s;
    if (e.target === s || e.target.closest("[data-x]") || st === j.stage) return s.remove();
    if (!st) return;
    s.remove();
    if (!confirm(`Move #${j.jobNumber} ${j.name} from ${j.stage} to ${st} in Homebase?`)) return;
    try { await K.setStage(j.jobNumber, st); jobsAll = null; dayData = null; openJob(j.jobNumber); } catch (err) { alert(err.message); }
  };
}

// ============================================================ Settings and connecting
function drawMenu() {
  $("#s-hands").checked = handsFree(); $("#s-voice").checked = readAloud();
  const s = K.setup();
  $("#s-about").textContent = `Keystone for Android ${Native.version ? Native.version() : ""}${s?.madeAt ? ` · connected ${new Date(s.madeAt).toLocaleDateString("en-US", { month: "short", day: "numeric" })} · ${s.contacts?.length || 0} contacts, ${s.stock?.length || 0} shop items` : ""}`;
}
$("#s-hands").onchange = (e) => Native.set("handsFree", e.target.checked ? "on" : "off");
$("#s-voice").onchange = (e) => { Native.set("readAloud", e.target.checked ? "on" : "off"); if (!e.target.checked) hush(); };
$("#p-go").onclick = async () => {
  const addr = $("#p-addr").value.trim(), code = $("#p-code").value.trim();
  if (!addr || code.replace(/\D/g, "").length !== 6) { $("#p-msg").textContent = "Type the address and the 6-digit code from the laptop."; return; }
  $("#p-go").disabled = true; $("#p-msg").textContent = "Connecting…";
  const r = await call("pair", addr, code);
  $("#p-go").disabled = false;
  if (r.error) { $("#p-msg").textContent = r.error; return; }
  Native.set("lastAddress", addr); Native.set("myJobs", ""); $("#p-code").value = ""; history = []; $("#talk").innerHTML = ""; dayData = null; jobsAll = null;
  show("home"); warm();
};
window.onNativeBack = () => {
  const s = document.querySelector(".sheet"); if (s) { s.remove(); return true; }
  if (view === "job") { show("jobs"); return true; }
  if (view === "pair" && K.paired()) { show("menu"); return true; }
  if (view !== "home" && view !== "pair") { show("home"); return true; }
  return false;
};

if (K.paired()) { show("home"); warm(); } else show("pair");
</script>
</body>
</html>
