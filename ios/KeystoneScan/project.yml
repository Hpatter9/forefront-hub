# Keystone Scan: measures rooms with the iPhone's LiDAR (Apple RoomPlan) and sends them to the job in Homebase.
# The Xcode project is generated from this file (xcodegen generate); it isn't kept in the repo.
name: KeystoneScan
options:
  bundleIdPrefix: com.forefront
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  KeystoneScan:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Keystone Scan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Keystone Scan uses the camera and LiDAR scanner to measure rooms.
        NSLocalNetworkUsageDescription: Keystone Scan connects to Keystone on your laptop once, over your Wi-Fi, to get its settings.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forefront.keystonescan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    scheme: {}
